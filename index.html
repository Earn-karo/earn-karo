<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#061326"><title>Earn Bro — Gaming & Rewards</title><style>
:root{--bg:#061326;--p:#0b1e36;--p2:#102844;--line:#1d4164;--blue:#138bff;--cyan:#19d8f5;--green:#00d68f;--text:#eef7ff;--muted:#9bb5ce;--gold:#ffc94a}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 70% -10%,#123e6d 0,transparent 35%),var(--bg);font-family:system-ui,Arial,sans-serif;color:var(--text)}button,input,select{font:inherit}button{cursor:pointer;border:0}.layout{max-width:1180px;margin:auto;min-height:100vh;display:grid;grid-template-columns:225px 1fr}.side{padding:22px 14px;border-right:1px solid var(--line);height:100vh;position:sticky;top:0}.brand{font-size:25px;font-weight:900;margin:0 0 25px}.brand b{color:var(--cyan)}.nav{display:grid;gap:6px}.nav button{background:none;color:var(--muted);text-align:left;padding:12px;border-radius:11px}.nav button.active,.nav button:hover{background:#10345a;color:white}.main{padding:23px;min-width:0}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:18px}.eyebrow{color:var(--cyan);font-size:11px;letter-spacing:1.5px;font-weight:800}.top h1{margin:3px 0;font-size:25px}.pill{background:var(--p);border:1px solid var(--line);border-radius:25px;padding:9px 12px;font-size:12px;color:var(--muted)}.hero{background:linear-gradient(115deg,#0a3e8f,#073052 65%,#08253e);border:1px solid #1d6db0;border-radius:20px;padding:24px;display:flex;justify-content:space-between;align-items:center;gap:15px}.hero h2{font-size:clamp(25px,4vw,38px);margin:8px 0}.hero p{color:#c5e5ff;max-width:500px}.hero .art{font-size:72px}.btn{padding:11px 15px;border-radius:10px;font-weight:800;background:linear-gradient(100deg,#0784ff,#08b7e7);color:white}.btn.green{background:linear-gradient(100deg,#00a96e,#00d68f);color:#03241a}.btn.alt{background:#153654;border:1px solid var(--line)}.btn:disabled{opacity:.45;cursor:not-allowed}.stats,.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:16px 0}.stat,.card,.game,.task{background:linear-gradient(145deg,#0c213a,#091a2e);border:1px solid var(--line);border-radius:15px;padding:15px}.stat small,.muted{color:var(--muted)}.stat strong{display:block;font-size:24px;margin-top:8px}.head{display:flex;justify-content:space-between;align-items:center;margin:24px 0 12px}.head h2{font-size:18px;margin:0}.game .ico{font-size:42px;background:linear-gradient(135deg,#162f7a,#0b6b91);padding:12px;text-align:center;border-radius:12px}.game h3{font-size:15px;margin:10px 0 4px}.game p,.task p{font-size:12px;color:var(--muted)}.reward{color:var(--gold);font-weight:800}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.row>*{flex:1;min-width:0}.field{display:grid;gap:6px;margin:12px 0}.field label{font-size:12px;color:var(--muted)}.field input,.field select{width:100%;padding:12px;border:1px solid var(--line);background:#06172b;color:white;border-radius:10px}.task{display:flex;align-items:center;gap:12px;margin:9px 0}.task .body{flex:1}.task h3{font-size:14px;margin:0}.notice{border:1px solid #735c27;background:#2c2717;border-radius:12px;padding:12px;color:#ffe2a1;font-size:12px;line-height:1.5;margin:12px 0}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:12px;margin:12px 0}table{border-collapse:collapse;width:100%;min-width:500px}th,td{text-align:left;padding:11px;border-bottom:1px solid #163451;font-size:12px}th{color:var(--muted)}.auth{max-width:440px;margin:7vh auto;padding:24px;background:var(--p);border:1px solid var(--line);border-radius:20px}.auth h1{text-align:center}.auth .brand{text-align:center}.auth .btn.full{width:100%;margin-top:8px}.switch{text-align:center;color:var(--muted);font-size:13px;margin:17px 0}.link{color:var(--cyan);background:none;padding:0;font-weight:800}.hidden{display:none!important}.mobile{display:none}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#d9fff1;color:#003d2b;border-radius:10px;padding:12px 16px;font-size:13px;font-weight:800;z-index:10;max-width:90vw}.wallet{background:linear-gradient(120deg,#063e48,#0b263e);border:1px solid #087c82;border-radius:15px;padding:18px;margin-bottom:12px}.wallet strong{font-size:28px;display:block}
@media(max-width:760px){.layout{display:block;padding-bottom:74px}.side{display:none}.main{padding:15px 12px}.top h1{font-size:22px}.hero{padding:19px}.hero .art{font-size:50px}.stats{grid-template-columns:1fr 1fr}.stats .stat:last-child{grid-column:span 2}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.game{padding:10px}.mobile{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:8;background:#061326f5;border-top:1px solid var(--line);justify-content:space-around;padding:8px 2px calc(8px + env(safe-area-inset-bottom))}.mobile button{background:none;color:var(--muted);font-size:10px;display:grid;gap:3px;place-items:center}.mobile button span{font-size:19px}.mobile button.active{color:var(--cyan)}.task{align-items:flex-start}.task .btn{padding:8px;font-size:11px}.auth{margin:4vh 12px}.hero .art{display:none}}
</style></head><body><div id="root"></div><div id="toast" class="toast hidden"></div><script>
const $=s=>document.querySelector(s);let page='home',me=null,catalog={games:[],tasks:[],done:[]};
async function api(url,opts={}){let r=await fetch('/api'+url,{credentials:'same-origin',headers:{'Content-Type':'application/json',...(opts.headers||{})},...opts});let d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Something went wrong');return d}
function toast(t){$('#toast').textContent=t;$('#toast').classList.remove('hidden');setTimeout(()=>$('#toast').classList.add('hidden'),2800)}
function cash(p){return '₹'+(Number(p||0)/100).toFixed(2)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function nav(){return [['home','⌂','Home'],['games','🎮','Games'],['tasks','☑','Tasks'],['wallet','▣','Wallet'],['profile','●','Profile'],...(me?.role==='admin'?[['admin','⚙','Admin']]:[])].map(([id,i,l])=>`<button class="${page===id?'active':''}" onclick="go('${id}')"><span>${i}</span>${l}</button>`).join('')}
function frame(content){$('#root').innerHTML=`<div class="layout"><aside class="side"><div class="brand">🎮 Earn <b>Bro</b></div><nav class="nav">${nav()}</nav><div class="notice" style="position:absolute;bottom:12px;left:12px;right:12px">Mobile-first gaming rewards<br><b>Real payment integration</b></div></aside><main class="main"><header class="top"><div><div class="eyebrow">GAMING • TASKS • REWARDS</div><h1>${({home:'Welcome back!',games:'Explore games',tasks:'Earn with tasks',wallet:'Your wallet',profile:'Your profile',admin:'Admin panel'})[page]}</h1></div><div class="pill">${esc(me.name)} · ${cash(me.balance_paise)}</div></header>${content}</main></div><nav class="mobile">${nav()}</nav>`}
function auth(mode='login'){page='auth';$('#root').innerHTML=`<section class="auth"><div class="brand">🎮 Earn <b style="color:var(--cyan)">Bro</b></div><h1>${mode==='login'?'Welcome back':'Create account'}</h1><p class="muted" style="text-align:center">Games, tasks and rewards in one place.</p><form id="authform">${mode==='signup'?`<div class="field"><label>Name</label><input name="name" required minlength="2" maxlength="50"></div>`:''}<div class="field"><label>Email</label><input name="email" type="email" required></div><div class="field"><label>Password (minimum 10 characters)</label><input name="password" type="password" minlength="10" required></div><button class="btn full">${mode==='login'?'Login':'Sign up'}</button></form><div class="switch">${mode==='login'?'New here?':'Already registered?'} <button class="link" onclick="auth('${mode==='login'?'signup':'login'}')">${mode==='login'?'Create account':'Login'}</button></div><p class="muted" style="font-size:11px">Use a unique password. Payments are only enabled after the site owner configures the gateway keys.</p></section>`;$('#authform').onsubmit=async e=>{e.preventDefault();let f=Object.fromEntries(new FormData(e.target));try{let d=await api('/auth/'+(mode==='login'?'login':'signup'),{method:'POST',body:JSON.stringify(f)});me=d.user;await go('home')}catch(e){toast(e.message)}}}
async function refresh(){let d=await api('/me');me=d.user;catalog=await api('/catalog')}
async function go(p){page=p;try{await refresh()}catch(e){auth();return}page=p;if(p==='home')home();else if(p==='games')games();else if(p==='tasks')tasks();else if(p==='wallet')wallet();else if(p==='profile')profile();else if(p==='admin')admin()}
function gameCard(g){let done=catalog.done.some(x=>x.kind==='game'&&x.title===g.name);return `<article class="game"><div class="ico">${g.icon}</div><h3>${esc(g.name)}</h3><p>${esc(g.description)}</p><div class="row"><span class="reward">+${g.points} pts</span><button class="btn" ${done?'disabled':''} onclick="activity('game','${esc(g.name)}')">${done?'Played':'Play demo'}</button></div></article>`}
function taskCard(t){let done=catalog.done.some(x=>x.kind==='task'&&x.title===t.name);return `<article class="task"><div style="font-size:26px">🎁</div><div class="body"><h3>${esc(t.name)}</h3><p>${esc(t.description)}</p><span class="reward">+${t.points} pts</span></div><button class="btn" ${done?'disabled':''} onclick="activity('task','${esc(t.name)}')">${done?'Claimed':'Claim'}</button></article>`}
function home(){frame(`<section class="hero"><div><div class="eyebrow">LEVEL UP YOUR PLAY</div><h2>Play games.<br><span style="color:var(--cyan)">Collect rewards.</span></h2><p>Explore mini-games and track your reward points from any device.</p><button class="btn" onclick="go('games')">Explore games →</button></div><div class="art">🕹️</div></section><section class="stats"><div class="stat"><div class="muted">Wallet balance</div><strong>${cash(me.balance_paise)}</strong><small>Account balance</small></div><div class="stat"><div class="muted">Games tried</div><strong>${catalog.done.filter(x=>x.kind==='game').length}</strong></div><div class="stat"><div class="muted">Tasks claimed</div><strong>${catalog.done.filter(x=>x.kind==='task').length}</strong></div></section><div class="head"><h2>Popular games</h2></div><div class="grid">${catalog.games.slice(0,3).map(gameCard).join('')}</div><div class="head"><h2>Quick tasks</h2></div>${catalog.tasks.slice(0,2).map(taskCard).join('')}`)}
function games(){frame(`<div class="notice">Game and task points are starter/demo rewards. Before offering cash-convertible rewards publicly, add anti-fraud controls, written rules, age restrictions, and legal review.</div><div class="grid">${catalog.games.map(gameCard).join('')}</div>`)}
function tasks(){frame(`<div class="notice">Each activity can be claimed once per account. Add stronger anti-abuse checks before production launch.</div>${catalog.tasks.map(taskCard).join('')}`)}
async function activity(kind,title){try{let d=await api('/activities',{method:'POST',body:JSON.stringify({kind,title})});me=d.user;toast('Reward added: +'+d.points+' points');await go(page)}catch(e){toast(e.message)}}
async function wallet(){let h=await api('/history');frame(`<div class="wallet"><div class="muted">Available balance</div><strong>${cash(me.balance_paise)}</strong><div class="muted">Wallet is stored on the server.</div></div><div class="card"><h2>UPI payment / Add funds</h2><p class="muted">Uses Razorpay Checkout. Configure test API keys on the server first.</p><form id="payform"><div class="field"><label>Amount (₹1–₹10,000)</label><input type="number" name="amount" min="1" max="10000" step="1" value="100" required></div><button class="btn green">Pay securely with UPI / Razorpay</button></form><div class="notice">Never enter or share your UPI PIN on this website. Complete payment only in the official payment gateway checkout.</div></div><div class="card"><h2>Withdrawal request</h2><p class="muted">Requests go to admin review. This starter does not send payouts automatically.</p><form id="wdform"><div class="row"><div class="field"><label>Amount (₹)</label><input name="amount" type="number" min="1" step="1" required></div><div class="field"><label>Your UPI ID</label><input name="upiId" placeholder="name@bank" required></div></div><button class="btn">Request withdrawal</button></form></div><div class="head"><h2>Payment history</h2></div><div class="tablewrap"><table><tr><th>Order</th><th>Amount</th><th>Status</th><th>Date</th></tr>${h.payments.map(x=>`<tr><td>${esc(x.razorpay_order_id)}</td><td>${cash(x.amount_paise)}</td><td>${esc(x.status)}</td><td>${esc(x.created_at)}</td></tr>`).join('')||'<tr><td colspan="4">No payments yet.</td></tr>'}</table></div><div class="head"><h2>Withdrawal history</h2></div><div class="tablewrap"><table><tr><th>Amount</th><th>UPI ID</th><th>Status</th></tr>${h.withdrawals.map(x=>`<tr><td>${cash(x.amount_paise)}</td><td>${esc(x.upi_id)}</td><td>${esc(x.status)}</td></tr>`).join('')||'<tr><td colspan="3">No requests yet.</td></tr>'}</table></div>`);
$('#payform').onsubmit=async e=>{e.preventDefault();try{const amount=Number(new FormData(e.target).get('amount'));const order=await api('/payments/order',{method:'POST',body:JSON.stringify({amount})});if(!window.Razorpay){await new Promise((ok,no)=>{let s=document.createElement('script');s.src='https://checkout.razorpay.com/v1/checkout.js';s.onload=ok;s.onerror=no;document.head.appendChild(s)});}const rzp=new Razorpay({key:order.keyId,amount:order.amount,currency:order.currency,name:'Earn Bro',description:'Wallet top-up',order_id:order.orderId,handler:async response=>{try{await api('/payments/verify',{method:'POST',body:JSON.stringify(response)});toast('Payment verified and wallet updated.');go('wallet')}catch(e){toast(e.message)}},modal:{ondismiss:()=>toast('Payment window closed.')}});rzp.open()}catch(e){toast(e.message)}};
$('#wdform').onsubmit=async e=>{e.preventDefault();let f=Object.fromEntries(new FormData(e.target));f.amount=Number(f.amount)*100;try{let d=await api('/withdrawals',{method:'POST',body:JSON.stringify(f)});toast(d.message);go('wallet')}catch(e){toast(e.message)}}}
function profile(){frame(`<div class="card"><h2>${esc(me.name)}</h2><p class="muted">${esc(me.email)}</p><span class="pill">${esc(me.role)}</span><div class="head"><h2>Account settings</h2></div><form id="nameform"><div class="field"><label>Display name (profile editing starter)</label><input name="name" value="${esc(me.name)}" minlength="2" maxlength="50" required></div><button class="btn alt" type="button" onclick="logout()">Log out</button></form><p class="muted">Account data is stored in the server database.</p></div>`)}
async function logout(){try{await api('/auth/logout',{method:'POST',body:'{}'})}catch{}me=null;auth()}
async function admin(){if(me.role!=='admin'){toast('Admin access required');return go('home')}let d=await api('/admin/overview');frame(`<div class="notice">Admin actions are server-side protected. Withdrawal approval here only marks the request for manual payout; it does not send money.</div><div class="stats"><div class="stat">Users<strong>${d.totals.users}</strong></div><div class="stat">Paid orders<strong>${d.totals.paid_orders}</strong></div><div class="stat">Pending withdrawals<strong>${d.totals.pending_withdrawals}</strong></div></div><div class="head"><h2>Users</h2></div><div class="tablewrap"><table><tr><th>Name</th><th>Email</th><th>Role</th><th>Balance</th></tr>${d.users.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.email)}</td><td>${esc(u.role)}</td><td>${cash(u.balance_paise)}</td></tr>`).join('')}</table></div><div class="head"><h2>Withdrawal requests</h2></div><div class="tablewrap"><table><tr><th>Email</th><th>Amount</th><th>UPI</th><th>Status</th><th>Review</th></tr>${d.withdrawals.map(w=>`<tr><td>${esc(w.email)}</td><td>${cash(w.amount_paise)}</td><td>${esc(w.upi_id)}</td><td>${esc(w.status)}</td><td>${w.status==='pending_review'?`<button class="btn" onclick="review(${w.id},'approved_for_manual_payout')">Approve for manual payout</button> <button class="btn alt" onclick="review(${w.id},'rejected')">Reject</button>`:'—'}</td></tr>`).join('')}</table></div>`)}
async function review(id,status){try{await api('/admin/withdrawals/'+id+'/review',{method:'POST',body:JSON.stringify({status})});toast('Request status updated');admin()}catch(e){toast(e.message)}}
(async()=>{try{await refresh();go('home')}catch{auth()}})();
</script></body></html>
